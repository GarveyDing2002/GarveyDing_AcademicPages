mily="Noto Sans CJK SC, sans-serif" fill="#13263F" font-weight="400" font-size="17">nominal aperture</text><rect x="1163.0" y="455" width="123.625" height="48" fill="#e17f41" rx="8" opacity=".85"/><text x="62" y="488" font-family="Noto Sans CJK SC, sans-serif" fill="#13263F" font-weight="400" font-size="17">late aperture / risk</text><text x="75" y="600" font-family="Noto Sans CJK SC, sans-serif" fill="#995f08" font-weight="400" font-size="18">边界：本图仅为相位冲突示意；真正有效 window 需扣除 THA 输出建立/开关过渡/guard time</text>
