<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<title>ADC 架构分类与选型地图</title>
<rect width="1200" height="680" fill="#fbfdff"/>
<text x="600" y="48" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#183b4a">ADC 架构分类与选型地图</text>
<text x="600" y="82" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#56727d">速度、分辨率、功耗与应用场景的综合权衡</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#587987"/></marker></defs>
<g stroke="#2d6d82" stroke-width="2">
<rect x="60" y="245" width="170" height="110" rx="16" fill="#e6f1f5"/><rect x="300" y="110" width="205" height="105" rx="16" fill="#eef6ee"/><rect x="300" y="275" width="205" height="105" rx="16" fill="#fff5e4"/><rect x="300" y="440" width="205" height="105" rx="16" fill="#f2edfa"/><rect x="590" y="85" width="245" height="125" rx="16" fill="#edf6f8"/><rect x="590" y="275" width="245" height="125" rx="16" fill="#edf6f8"/><rect x="590" y="465" width="245" height="125" rx="16" fill="#edf6f8"/><rect x="920" y="245" width="220" height="110" rx="16" fill="#f7eff0"/>
</g>
<g font-family="Microsoft YaHei, sans-serif" text-anchor="middle" fill="#193d4b"><text x="145" y="292" font-size="23" font-weight="700">系统需求</text><text x="145" y="325" font-size="16">速度 · 精度 · 功耗</text><text x="145" y="348" font-size="16">输入与应用边界</text><text x="402" y="153" font-size="22" font-weight="700">并行量化</text><text x="402" y="183" font-size="16">Flash / Folding</text><text x="402" y="203" font-size="16">极高速，功耗高</text><text x="402" y="318" font-size="22" font-weight="700">逐次逼近</text><text x="402" y="348" font-size="16">SAR / Pipeline-SAR</text><text x="402" y="368" font-size="16">能效与精度平衡</text><text x="402" y="483" font-size="22" font-weight="700">过采样</text><text x="402" y="513" font-size="16">ΣΔ / VCO-based</text><text x="402" y="533" font-size="16">带宽换分辨率</text><text x="712" y="132" font-size="22" font-weight="700">高速路径</text><text x="712" y="164" font-size="16">Pipeline / Time-Interleaved</text><text x="712" y="188" font-size="16">级间增益、时序与校准</text><text x="712" y="322" font-size="22" font-weight="700">中速高精度</text><text x="712" y="354" font-size="16">SAR / Noise-Shaping SAR</text><text x="712" y="378" font-size="16">CDAC、比较器与参考</text><text x="712" y="512" font-size="22" font-weight="700">低带宽高精度</text><text x="712" y="544" font-size="16">ΣΔ / 积分型架构</text><text x="712" y="568" font-size="16">数字滤波与噪声整形</text><text x="1030" y="292" font-size="23" font-weight="700">选型结果</text><text x="1030" y="325" font-size="16">架构 + 前端 + 校准</text><text x="1030" y="348" font-size="16">必须一起验证</text></g>
<g fill="none" stroke="#587987" stroke-width="3" marker-end="url(#arrow)"><path d="M230 300 L300 160"/><path d="M230 300 L300 328"/><path d="M230 300 L300 492"/><path d="M505 160 L590 145"/><path d="M505 328 L590 338"/><path d="M505 492 L590 528"/><path d="M835 145 L920 300"/><path d="M835 338 L920 300"/><path d="M835 528 L920 300"/></g>
<rect x="380" y="620" width="440" height="34" rx="12" fill="#f3f7f8" stroke="#99aeb7"/><text x="600" y="643" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#45636e">示意图：具体边界取决于采样率、输入带宽和系统指标</text>
</svg>
