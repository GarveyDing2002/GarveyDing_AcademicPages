<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="500" version="1.1" viewBox="0 0 1160 500" width="1160" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path d="M0,0 L8,4 L0,8 z" fill="#2563EB" /></marker></defs><rect fill="#FFFFFF" height="500" width="1160" x="0" y="0" /><rect fill="#2563EB" height="9" width="1160" x="0" y="0" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="28" font-weight="bold" x="36" y="52">SF / SSF / FVF: output-impedance view</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="15" x="36" y="79">控制方式不同：不要把三种电路仅当作串行性能等级</text><rect fill="#EAF2FF" height="180" rx="13" ry="13" stroke="#2563EB" stroke-width="2" width="335" x="45" y="155" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="212.5" y="243.0">SF</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="212.5" y="269.0">Device feedback</text><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="210" y="373">Zout ~ 1/(gm+gmb)</text><rect fill="#E2FAF5" height="180" rx="13" ry="13" stroke="#07867B" stroke-width="2" width="335" x="415" y="155" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="582.5" y="243.0">SSF</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="582.5" y="269.0">Auxiliary local gain</text><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="580" y="373">Zout ~ Z0/(1+TSSF)</text><rect fill="#EAF2FF" height="180" rx="13" ry="13" stroke="#D97706" stroke-width="2" width="335" x="785" y="155" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="952.5" y="243.0">FVF</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="952.5" y="269.0">Flipped local loop</text><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="950" y="373">Zout ~ Z0/(1+TFVF)</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="580" y="457">Exact model depends on output device, body effect, ro, loading and loop definition.</text></svg>