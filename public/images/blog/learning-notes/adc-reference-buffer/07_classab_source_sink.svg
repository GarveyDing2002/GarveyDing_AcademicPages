<svg baseProfile="full" height="500" version="1.1" viewBox="0 0 1160 500" width="1160" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path d="M0,0 L8,4 L0,8 z" fill="#2563EB" /></marker></defs><rect fill="#FFFFFF" height="500" width="1160" x="0" y="0" /><rect fill="#2563EB" height="9" width="1160" x="0" y="0" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="28" font-weight="bold" x="36" y="52">Class-AB RVB: two-direction current delivery</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="15" x="36" y="79">PMOS sourcing is strengthened when reference droops; NMOS sinking when charge is returned</text><rect fill="#EAF2FF" height="90" rx="13" ry="13" stroke="#2563EB" stroke-width="2" width="270" x="80" y="165" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="215.0" y="208.0">Upper pull-up path</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="215.0" y="234.0">PMOS → source current</text><rect fill="#E2FAF5" height="90" rx="13" ry="13" stroke="#07867B" stroke-width="2" width="270" x="443" y="165" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="578.0" y="208.0">VREF output node</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="578.0" y="234.0">CDAC current ± i(t)</text><rect fill="#EAF2FF" height="90" rx="13" ry="13" stroke="#2563EB" stroke-width="2" width="270" x="806" y="165" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="941.0" y="208.0">Lower pull-down path</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="941.0" y="234.0">NMOS → sink current</text><line fill="none" marker-end="url(#arrow)" stroke="#2563EB" stroke-width="2.5" x1="350" x2="443" y1="210" y2="210" /><line fill="none" marker-end="url(#arrow)" stroke="#2563EB" stroke-width="2.5" x1="806" x2="713" y1="210" y2="210" /><text fill="#2563EB" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="230" y="309">VREF↓ → I_source↑</text><text fill="#D97706" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="933" y="309">VREF↑ → I_sink↑</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="580" y="408">Small IQ does not guarantee large peak current: verify both directions and recovery asymmetry.</text></svg>