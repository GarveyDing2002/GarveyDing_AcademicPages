<svg baseProfile="full" height="500" version="1.1" viewBox="0 0 1160 500" width="1160" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path d="M0,0 L8,4 L0,8 z" fill="#2563EB" /></marker></defs><rect fill="#FFFFFF" height="500" width="1160" x="0" y="0" /><rect fill="#2563EB" height="9" width="1160" x="0" y="0" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="28" font-weight="bold" x="36" y="52">RVB architecture taxonomy</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="15" x="36" y="79">按不同维度分类：输出级、控制环、储能、分布方式，不是互斥类型</text><rect fill="#EAF2FF" height="60" rx="13" ry="13" stroke="#2563EB" stroke-width="2" width="280" x="440" y="110" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="580.0" y="146.0">ADC RVB System</text><rect fill="#EAF2FF" height="92" rx="13" ry="13" stroke="#2563EB" stroke-width="2" width="213" x="20" y="260" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="126.5" y="304.0">Follower</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="126.5" y="330.0">SF / SSF / FVF</text><polyline fill="none" points="580,170 580,205 126,205 126,260" stroke="#2563EB" stroke-width="2" /><rect fill="#EAF2FF" height="92" rx="13" ry="13" stroke="#2563EB" stroke-width="2" width="213" x="252" y="260" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="358.5" y="304.0">Output Driver</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="358.5" y="330.0">Class-A / AB / Push-pull</text><polyline fill="none" points="580,170 580,205 358,205 358,260" stroke="#2563EB" stroke-width="2" /><rect fill="#EAF2FF" height="92" rx="13" ry="13" stroke="#2563EB" stroke-width="2" width="213" x="484" y="260" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="590.5" y="304.0">Feedback</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="590.5" y="330.0">Global / Local / Multi-loop</text><polyline fill="none" points="580,170 580,205 590,205 590,260" stroke="#2563EB" stroke-width="2" /><rect fill="#EAF2FF" height="92" rx="13" ry="13" stroke="#2563EB" stroke-width="2" width="213" x="716" y="260" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="822.5" y="304.0">Charge Storage</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="822.5" y="330.0">CDEC / Small-C / Capless</text><polyline fill="none" points="580,170 580,205 822,205 822,260" stroke="#2563EB" stroke-width="2" /><rect fill="#E2FAF5" height="92" rx="13" ry="13" stroke="#07867B" stroke-width="2" width="213" x="948" y="260" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1054.5" y="304.0">Distribution</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="1054.5" y="330.0">Shared / Hierarchical / Local</text><polyline fill="none" points="580,170 580,205 1054,205 1054,260" stroke="#2563EB" stroke-width="2" /><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="17" font-weight="normal"