<svg baseProfile="full" height="500" version="1.1" viewBox="0 0 1160 500" width="1160" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path d="M0,0 L8,4 L0,8 z" fill="#2563EB" /></marker></defs><rect fill="#FFFFFF" height="500" width="1160" x="0" y="0" /><rect fill="#2563EB" height="9" width="1160" x="0" y="0" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="28" font-weight="bold" x="36" y="52">FVF negative-feedback loop: sign test</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="15" x="36" y="79">示意采用 NMOS source follower + 反向误差检测器；实际晶体管实现需按原图确定极性</text><rect fill="#FFF2DA" height="90" rx="13" ry="13" stroke="#D97706" stroke-width="2" width="230" x="50" y="158" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="165.0" y="201.0">VOUT drops</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="165.0" y="227.0">Δvout &lt; 0</text><rect fill="#EAF2FF" height="90" rx="13" ry="13" stroke="#2563EB" stroke-width="2" width="225" x="330" y="158" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="442.5" y="201.0">Inverting sensor</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="442.5" y="227.0">Δvx &gt; 0</text><rect fill="#EAF2FF" height="90" rx="13" ry="13" stroke="#2563EB" stroke-width="2" width="225" x="605" y="158" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="717.5" y="201.0">NMOS pass</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="717.5" y="227.0">ΔIsource &gt; 0</text><rect fill="#E2FAF5" height="90" rx="13" ry="13" stroke="#07867B" stroke-width="2" width="225" x="880" y="158" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="992.5" y="201.0">VOUT rises</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="992.5" y="227.0">Opposes disturbance</text><line fill="none" marker-end="url(#arrow)" stroke="#2563EB" stroke-width="2.5" x1="280" x2="330" y1="203" y2="203" /><line fill="none" marker-end="url(#arrow)" stroke="#2563EB" stroke-width="2.5" x1="555" x2="605" y1="203" y2="203" /><line fill="none" marker-end="url(#arrow)" stroke="#2563EB" stroke-width="2.5" x1="830" x2="880" y1="203" y2="203" /><polyline fill="none" points="994,249 994,332 166,332 166,249" stroke="#07867B" stroke-width="3" /><text fill="#07867B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="580" y="365">Local negative feedback: output disturbance → corrective current</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" x="580" y="423">For PMOS / alternative FVF variants, follow actual small-signal polarity instead of memorizing gate sign.</text></svg>