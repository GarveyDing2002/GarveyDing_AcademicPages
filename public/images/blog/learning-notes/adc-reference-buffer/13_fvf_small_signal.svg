<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="500" version="1.1" viewBox="0 0 1160 500" width="1160" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path d="M0,0 L8,4 L0,8 z" fill="#2563EB" /></marker></defs><rect fill="#FFFFFF" height="500" width="1160" x="0" y="0" /><rect fill="#2563EB" height="9" width="1160" x="0" y="0" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="28" font-weight="bold" x="36" y="52">FVF small-signal abstraction: output current correction</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="15" x="36" y="79">Two-stage conceptual model — useful for sign / impedance, not a transistor-accurate schematic</text><rect fill="#FFF2DA" height="94" rx="13" ry="13" stroke="#D97706" stroke-width="2" width="225" x="40" y="180" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="152.5" y="225.0">Output perturbation</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="152.5" y="251.0">vx = δVOUT</text><rect fill="#EAF2FF" height="94" rx="13" ry="13" stroke="#2563EB" stroke-width="2" width="245" x="325" y="180" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="447.5" y="225.0">Inverting sensor</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="447.5" y="251.0">vg ≈ −As·vx</text><rect fill="#EAF2FF" height="94" rx="13" ry="13" stroke="#2563EB" stroke-width="2" width="240" x="628" y="180" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="748.0" y="225.0">Transconductor</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="748.0" y="251.0">δipass ≈ gm,p·vg</text><rect fill="#EAF2FF" height="94" rx="13" ry="13" stroke="#2563EB" stroke-width="2" width="190" x="934" y="180" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="1029.0" y="225.0">Output Z0</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="1029.0" y="251.0">δvout = Z0·δi</text><line fill="none" marker-end="url(#arrow)" stroke="#2563EB" stroke-width="2.5" x1="265" x2="325" y1="227" y2="227" /><line fill="none" marker-end="url(#arrow)" stroke="#2563EB" stroke-width="2.5" x1="570" x2="628" y1="227" y2="227" /><line fill="none" marker-end="url(#arrow)" stroke="#2563EB" stroke-width="2.5" x1="868" x2="934" y1="227" y2="227" /><polyline fill="none" points="1030,274 1030,343 154,343 154,274" stroke="#07867B" stroke-width="3" /><text fill="#07867B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="580" y="408">|T0| ≈ |As·gm,p·Z0|;    Zout,CL ≈ Z0/(1+T0)    when loop is stable</text></svg>