<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="500" version="1.1" viewBox="0 0 1160 500" width="1160" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path d="M0,0 L8,4 L0,8 z" fill="#2563EB" /></marker></defs><rect fill="#FFFFFF" height="500" width="1160" x="0" y="0" /><rect fill="#2563EB" height="9" width="1160" x="0" y="0" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="28" font-weight="bold" x="36" y="52">External-C LDO vs Capless / OCL-LDO</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="15" x="36" y="79">Dominant-pole location depends on compensation: this is a topology tendency, not a universal law</text><rect fill="#EAF2FF" height="110" rx="13" ry="13" stroke="#2563EB" stroke-width="2" width="525" x="30" y="125" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="292.5" y="178.0">External large-C LDO</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="292.5" y="204.0">Usually output-pole dominant</text><rect fill="#EAF2FF" height="110" rx="13" ry="13" stroke="#2563EB" stroke-width="2" width="525" x="605" y="125" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="867.5" y="178.0">Capless, internal compensation</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="867.5" y="204.0">Often internal-node dominant</text><rect fill="#E2FAF5" height="112" rx="13" ry="13" stroke="#07867B" stroke-width="2" width="525" x="605" y="287" /><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="867.5" y="341.0">FVF / output-pole dominant OCL</text><text fill="#64748B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="867.5" y="367.0">Possible with internal pole pushing</text><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="285" y="275">pout ≈ 1/(Rout,OL·Cout)</text><text fill="#13243A" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="865" y="264">pX ≈ 1/(RX·CX,eff)</text><text fill="#07867B" font-family="Noto Sans Mono CJK SC, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="865" y="425">Output dominant is also possible!</text></svg>