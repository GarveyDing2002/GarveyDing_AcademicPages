<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690">
 <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#0D8AA9"/></marker></defs>
 <rect width="1400" height="690" fill="#f6f9fb" rx="18"/><rect width="1400" height="106" fill="#13263F" rx="18"/><rect y="81" width="1400" height="25" fill="#13263F"/>
 <text x="40" y="51" font-family="Noto Sans CJK SC, sans-serif" fill="white" font-weight="700" font-size="29">噪声 · 从源谱密度到最终采样码</text><text x="40" y="84" font-family="Noto Sans CJK SC, sans-serif" fill="#cde5f1" font-weight="400" font-size="18">LTI AC noise、周期噪声折叠、随机 jitter 使用不同模型</text>
 <text x="63" y="160" font-family="Noto Sans CJK SC, sans-serif" fill="#17324D" font-weight="400" font-size="20">随机电压噪声、确定性串扰与时间误差应分开建模，再在最终采样输出域合成</text><rect x="100" y="221" width="240" height="120" rx="13" fill="#e8f5f8" stroke="#9cbccb" stroke-width="2"/><text x="115" y="256" font-family="Noto Sans CJK SC, sans-serif" fill="#13263F" font-weight="700" font-size="22">MOS / R</text><text x="115" y="288" font-family="Noto Sans CJK SC, sans-serif" fill="#4d657c" font-weight="400" font-size="15">thermal + flicker</text><rect x="100" y="409" width="240" height="115" rx="13" fill="#fff3dd" stroke="#9cbccb" stroke-width="2"/><text x="115" y="444" font-family="Noto Sans CJK SC, sans-serif" fill="#13263F" font-weight="700" font-size="22">Clock / jitter</text><text x="115" y="476" font-family="Noto Sans CJK SC, sans-serif" fill="#4d657c" font-weight="400" font-size="15">dv/dt · δt</text><rect x="510" y="296" width="291" height="135" rx="13" fill="#e8f5f8" stroke="#9cbccb" stroke-width="2"/><text x="525" y="331" font-family="Noto Sans CJK SC, sans-serif" fill="#13263F" font-weight="700" font-size="22">Switch + CDAC</text><text x="525" y="363" font-family="Noto Sans CJK SC, sans-serif" fill="#4d657c" font-weight="400" font-size="15">kT/C, alias, folding</text><rect x="992" y="296" width="270" height="135" rx="13" fill="#e8f5f8" stroke="#9cbccb" stroke-width="2"/><text x="1007" y="331" font-family="Noto Sans CJK SC, sans-serif" fill="#13263F" font-weight="700" font-size="22">Digital output</text><text x="1007" y="363" font-family="Noto Sans CJK SC, sans-serif" fill="#4d657c" font-weight="400" font-size="15">sampled RMS / spur</text><path d="M 340 281 L 510 341" stroke="#0D8AA9" stroke-width="3.2" fill="none" marker-end="url(#arrow)"/><path d="M 340 468 L 510 397" stroke="#0D8AA9" stroke-width="3.2" fill="none" marker-end="url(#arrow)"/><path d="M 801 363 L 992 363" stroke="#0D8AA9" stroke-width="3.2" fill="none" marker-end="url(#arrow)"/><text x="564" y="501" font-family="Noto Sans CJK SC, sans-serif" fill="#155d91" font-weight="400" font-size="20">PNOISE or transient noise</text><text x="83" y="597" font-family="Noto Sans CJK SC, sans-serif" fill="#995f08" font-weight="400" font-size="18">噪声源的相关性与观测时刻决定是否能直接按方差合成</text>
 <text x="42" y="661" font-family="Noto Sans CJK SC, sans-serif" fill="#657b89" font-weight="400" font-size="16">研究示意 / 原创绘制 / 非实测、非特定 IEEE 论文原图</text>
