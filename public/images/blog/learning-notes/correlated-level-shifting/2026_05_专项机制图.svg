<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690">
 <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#0D8AA9"/></marker></defs>
 <rect width="1400" height="690" fill="#f6f9fb" rx="18"/><rect width="1400" height="106" fill="#13263F" rx="18"/><rect y="81" width="1400" height="25" fill="#13263F"/>
 <text x="40" y="51" font-family="Noto Sans CJK SC, sans-serif" fill="white" font-weight="700" font-size="29">CLS · 两相相关电平移位</text><text x="40" y="84" font-family="Noto Sans CJK SC, sans-serif" fill="#cde5f1" font-weight="400" font-size="18">第一相位与第二相位的幅度/相位一致性决定实际残差</text>
 <text x="50" y="161" font-family="Noto Sans CJK SC, sans-serif" fill="#17324D" font-weight="400" font-size="19">放大过程切成两相：第一个相位获取与误差相关的状态；第二个相位补偿有限增益误差</text><rect x="85" y="205" width="346" height="190" rx="13" fill="#e8f5f8" stroke="#9cbccb" stroke-width="2"/><text x="100" y="240" font-family="Noto Sans CJK SC, sans-serif" fill="#13263F" font-weight="700" font-size="22">Φ1 · 粗放大</text><text x="100" y="272" font-family="Noto Sans CJK SC, sans-serif" fill="#4d657c" font-weight="400" font-size="15">闭环产生 V1 与 finite-A error</text><rect x="507" y="205" width="346" height="190" rx="13" fill="#fff3dd" stroke="#9cbccb" stroke-width="2"/><text x="522" y="240" font-family="Noto Sans CJK SC, sans-serif" fill="#13263F" font-weight="700" font-size="22">CLS capacitor</text><text x="522" y="272" font-family="Noto Sans CJK SC, sans-serif" fill="#4d657c" font-weight="400" font-size="15">存储相关电压 / 误差状态</text><rect x="931" y="205" width="355" height="190" rx="13" fill="#e8f5f8" stroke="#9cbccb" stroke-width="2"/><text x="946" y="240" font-family="Noto Sans CJK SC, sans-serif" fill="#13263F" font-weight="700" font-size="22">Φ2 · 精放大</text><text x="946" y="272" font-family="Noto Sans CJK SC, sans-serif" fill="#4d657c" font-weight="400" font-size="15">重新连接 C_LS / average</text><path d="M 431 305 L 507 305" stroke="#0D8AA9" stroke-width="3.2" fill="none" marker-end="url(#arrow)"/><path d="M 853 305 L 931 305" stroke="#0D8AA9" stroke-width="3.2" fill="none" marker-end="url(#arrow)"/><rect x="410" y="468" width="581" height="111" rx="13" fill="#e7f6ed" stroke="#9cbccb" stroke-width="2"/><text x="425" y="503" font-family="Noto Sans CJK SC, sans-serif" fill="#13263F" font-weight="700" font-size="22">误差组成</text><text x="425" y="535" font-family="Noto Sans CJK SC, sans-serif" fill="#4d657c" font-weight="400" font-size="15">e_static + e_settle + e_switch + e_noise</text><polyline points="262,395 262,525 410,525" stroke="#1f6b99" stroke-width="3" fill="none"/><polyline points="1100,395 1100,525 991,525" stroke="#1f6b99" stroke-width="3" fill="none"/><text x="136" y="622" font-family="Noto Sans CJK SC, sans-serif" fill="#995f08" font-weight="400" font-size="17">不能简单宣称所有 CLS 都自动得到 1/(Aβ)^2 误差；由电容重接关系决定</text>
 <text x="42" y="661" font-family="Noto Sans CJK SC, sans-serif" fill="#657b89" font-weight="400" font-size="16">研究示意 / 原创绘制 / 非实测、非特定 IEEE 论文原图</text>
 </svg>